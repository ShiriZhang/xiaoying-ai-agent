[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-qa"
version = "0.1.0"
description = "Enterprise knowledge QA: reproducible engineering foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv==1.1.1",
    "fastapi==0.115.14",
    "pydantic==2.11.7",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
embedding = [
    "torch==2.9.0+cpu",
    "transformers==4.57.1",
    "safetensors==0.6.2",
    "huggingface-hub==0.36.0",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
